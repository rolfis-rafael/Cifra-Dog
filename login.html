<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Login - CifraDog</title>

</head>

<body>

    <div class="container">

        <div class="left-side">

            <img src="img/cifardoglogotexto.png" alt="Logo CifraDog" class="logo">

            <img src="img/dog.png" alt="Mascote CifraDog" class="dog">

        </div>

        <div class="login-container">

            <form action="login.php" method="POST">

                <h2>Login</h2>

                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <div class="input-group">
                        <div style="position: relative; width: 100%;">
                            
                            <input type="password" id="password" name="password" placeholder="Digite sua senha" 
                                style="padding-right: 40px; width: 100%; box-sizing: border-box; padding-top: 10px; padding-bottom: 10px;" required>
                            
                            <i class="fa-solid fa-eye" 
                            onclick="
                                let input = this.previousElementSibling; 
                                input.type = (input.type === 'password') ? 'text' : 'password';
                                this.classList.toggle('fa-eye-slash');
                            " 
                            style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666;">
                            </i>
                        </div>
                    </div>
                </div>


                <button type="submit">Entrar</button>

                <div class="register">
                    <h3>Não tenho uma conta <a href="cadastro.html">CRIAR</a></h3>
                </div>

                <div class="login-actions" style="text-align: center; margin-top: 20px;">
                    <p style="color: #888; font-size: 14px; margin-bottom: 10px;">Ou continue sem login:</p>
                    
                    <a href="hub.php" class="btn-visitante" style="
                        display: block;
                        padding: 12px;
                        background: transparent;
                        border: 1px solid #d9ae30;
                        color: #d9ae30;
                        text-decoration: none;
                        border-radius: 12px;
                        font-weight: bold;
                        transition: 0.3s;">
                        Entrar como Visitante
                    </a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
